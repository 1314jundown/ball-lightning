<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>卡牌效果</title>
<style>
  :root{
    --ink:#07060a;
    --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:
    radial-gradient(620px 460px at 50% 52%, rgba(190,52,124,.30), transparent 70%),
    radial-gradient(900px 620px at 50% 54%, rgba(70,22,64,.55), transparent 74%),
    #07060a;
    display:flex;align-items:center;justify-content:center;
    font:14px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;color:#fff}

  .row{display:flex;gap:44px;align-items:center;perspective:1200px}

  .card{
    position:relative;width:158px;height:232px;border-radius:28px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 0 20px;gap:5px;
    backdrop-filter:blur(14px) saturate(1.1);
    -webkit-box-reflect:below 10px linear-gradient(transparent 62%, rgba(255,255,255,.20));
    transform-style:preserve-3d;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),
               border-color .28s ease, box-shadow .28s ease, filter .28s ease;
    cursor:pointer;
  }

  .card .glow{
    position:absolute;inset:-40px;border-radius:60px;pointer-events:none;
    background:radial-gradient(closest-side, var(--glow), transparent 72%);
    opacity:0;transition:opacity .34s ease;filter:blur(12px);
  }
  .card:hover{transform:translateY(-10px) rotateX(3deg);border-color:var(--edge)}
  .card:hover .glow{opacity:.9}
  .card:hover{box-shadow:0 26px 70px -26px var(--shadow), 0 0 0 1px rgba(255,255,255,.06) inset}

  .card .ico{width:58px;height:58px;margin-bottom:auto;margin-top:26px;opacity:.92}
  .card .n{font-size:17px;letter-spacing:.01em}
  .card .s{font-size:9px;letter-spacing:.24em;color:rgba(255,255,255,.42)}

  /* 三张各自的气质 */
  .c1{--glow:rgba(40,150,120,.55);--edge:rgba(120,240,200,.55);--shadow:rgba(40,190,150,.55);
      background:linear-gradient(180deg,rgba(52,130,104,.34),rgba(8,20,16,.42))}
  .c2{--glow:rgba(220,60,140,.62);--edge:rgba(255,150,205,.60);--shadow:rgba(255,80,160,.55);
      background:linear-gradient(180deg,rgba(190,52,116,.40),rgba(38,8,24,.44))}
  .c3{--glow:rgba(190,70,60,.55);--edge:rgba(255,170,150,.55);--shadow:rgba(255,110,90,.5);
      background:linear-gradient(180deg,rgba(130,44,44,.38),rgba(22,8,10,.44))}

  /* 中间那张亮一档 */
  .c2{padding-bottom:22px}
  .c2 .n{font-size:17px}

  .hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;
        font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<div class="row">
  <div class="card c1">
    <div class="glow"></div>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#c8ffe8" stroke-width="1.05" stroke-linecap="round">
      <path d="M2.5 12.4c3.6-5.6 15.4-5.6 19 0-3.6 5.6-15.4 5.6-19 0z"/>
      <path d="M2.5 12.4h19"/>
      <path d="M9 12.4c1.5-1.6 4.5-1.6 6 0-1.5 1.6-4.5 1.6-6 0z" stroke-opacity=".7"/>
    </svg>
    <div class="n">Breeze</div>
    <div class="s">AIR · QUALITY</div>
  </div>

  <div class="card c2">
    <div class="glow"></div>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.05" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 4.6V2.6M12 21.4v-2M4.6 12h-2M21.4 12h-2M6.9 6.9 5.5 5.5M18.5 18.5l-1.4-1.4M17.1 6.9l1.4-1.4M5.5 18.5l1.4-1.4"/>
    </svg>
    <div class="n">Bloom</div>
    <div class="s">HEART · MIRTH</div>
  </div>

  <div class="card c3">
    <div class="glow"></div>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#ffd8cf" stroke-width="1.05" stroke-linecap="round">
      <path d="M12 21c3.9 0 6-2.5 6-5.9C18 10.7 12 3 12 3S6 10.7 6 15.1C6 18.5 8.1 21 12 21z"/>
      <path d="M12 18.4c1.5 0 2.3-1 2.3-2.3 0-1.6-2.3-4.3-2.3-4.3s-2.3 2.7-2.3 4.3c0 1.3.8 2.3 2.3 2.3z" stroke-opacity=".65"/>
    </svg>
    <div class="n">Ember</div>
    <div class="s">FIRE · COURAGE</div>
  </div>
</div>
<div class="hint">悬停 · 抬起与发光　｜　拖动 · 视角</div>

<script>
  /* 轻微跟随指针的 3D 倾斜 */
  const row = document.querySelector('.row');
  row.addEventListener('pointermove', e => {
    const r = row.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5;
    const y = (e.clientY - r.top) / r.height - .5;
    row.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 6}deg)`;
  });
  row.addEventListener('pointerleave', () => { row.style.transform = ''; });
  row.style.transition = 'transform .4s cubic-bezier(.2,.8,.2,1)';
</script>
</body>
</html>
