<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Bloom · 粒子花</title>
<style>
  html,body{margin:0;height:100%;background:#07050a;overflow:hidden;font:14px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  canvas{display:block}
  .ui{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:56px}
  .card{
    pointer-events:auto;width:132px;height:196px;border-radius:26px;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:18px;gap:6px;backdrop-filter:blur(10px);
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-6px);border-color:rgba(255,150,200,.55);box-shadow:0 18px 50px -18px rgba(255,90,170,.55)}
  .card .ico{width:46px;height:46px;margin-bottom:auto;margin-top:20px;opacity:.92}
  .card .n{font-size:15px;letter-spacing:.02em;color:#fff}
  .card .s{font-size:9px;letter-spacing:.22em;color:rgba(255,255,255,.45)}
  .card.b1{background:linear-gradient(180deg,rgba(60,140,110,.35),rgba(10,20,16,.35))}
  .card.b2{background:linear-gradient(180deg,rgba(200,60,120,.42),rgba(40,10,25,.4))}
  .card.b3{background:linear-gradient(180deg,rgba(120,40,50,.4),rgba(20,8,10,.4))}
  #hint{position:fixed;left:24px;bottom:20px;color:rgba(255,255,255,.35);font-size:11px;letter-spacing:.14em}
</style>
</head>
<body>
<div class="ui">
  <div class="card b1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#bfe" stroke-width="1.1"><path d="M3 12c4-6 14-6 18 0-4 6-14 6-18 0z"/><path d="M3 12h18"/></svg><div class="n">Breeze</div><div class="s">AIR · QUALITY</div></div>
  <div class="card b2"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1"><circle cx="12" cy="12" r="3.2"/><path d="M12 5.2v-2M12 20.8v-2M5.2 12h-2M20.8 12h-2M7.2 7.2 5.8 5.8M18.2 18.2l-1.4-1.4M16.8 7.2l1.4-1.4M5.8 18.2l1.4-1.4"/></svg><div class="n">Bloom</div><div class="s">HEART · MIRTH</div></div>
  <div class="card b3"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#f9b" stroke-width="1.1"><path d="M12 21c4 0 6-2.6 6-6 0-4.4-6-12-6-12S6 10.6 6 15c0 3.4 2 6 6 6z"/></svg><div class="n">Ember</div><div class="s">FIRE · COURAGE</div></div>
</div>
<div id="hint">拖动 · 旋转</div>

<script src="../vendor/three.bundle.js"></script>
<script>
/* ---------- 渲染器 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07050a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
camera.position.set(0, .35, 7.6);
camera.lookAt(0, -.1, 0);

/* ---------- 花瓣：参数化曲面撒点 ---------- */
function petalPoint(u, v) {            // u:0→1 沿瓣长, v:-1→1 横跨
  const w = Math.sin(Math.PI * Math.min(1, u * 1.06)) * .92;   // 宽度包络
  const x = v * w;
  const y = .28 + u * 1.55;                                     // 向上展开
  const z = Math.sin(u * Math.PI) * .55 * (1 - Math.abs(v) * .55); // 外翻
  return [x, y, z];
}

const PETALS = 7, PER = 3400;
const N = PETALS * PER;
const pos = new Float32Array(N * 3);
const col = new Float32Array(N * 3);
const rnd = new Float32Array(N);

let k = 0;
for (let p = 0; p < PETALS; p++) {
  const ang = (p / PETALS) * Math.PI * 2;
  const tilt = .22 + (p % 3) * .05;
  for (let i = 0; i < PER; i++) {
    const u = Math.pow(Math.random(), .72);
    const v = (Math.random() * 2 - 1);
    let [x, y, z] = petalPoint(u, v);

    // 边缘更密一点，看起来像花瓣卷边
    if (Math.abs(v) > .82) { x *= 1 + Math.random() * .06; }

    // 绕轴排列
    const cx = Math.cos(ang), sx = Math.sin(ang);
    const px = x * cx - z * sx;
    const pz = x * sx + z * cx;
    const py = y + Math.sin(ang * 3) * .05;

    pos[k * 3] = px; pos[k * 3 + 1] = py; pos[k * 3 + 2] = pz;

    // 颜色：内粉外浅，顶部偏白
    const t = Math.min(1, u * 1.2);
    const r = .98, g = .28 + t * .45, b = .52 + t * .34;
    col[k * 3] = r; col[k * 3 + 1] = g; col[k * 3 + 2] = b;
    rnd[k] = Math.random();
    k++;
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 1));

/* 软圆贴图 */
function softTex(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(inner, 'rgba(255,255,255,' + outer + ')');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPRITE = softTex(.35, .55);

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uMap: { value: SPRITE }, uTime: { value: 0 }, uPx: { value: Math.min(devicePixelRatio, 2) * 2.6 },
    uOpacity: { value: 1 }
  },
  vertexShader: `
    attribute float aRnd;
    varying vec3 vC; varying float vA;
    uniform float uPx, uTime;
    void main(){
      vC = color;
      vec3 p = position;
      p.y += sin(uTime * 1.4 + aRnd * 22.0) * 0.012;
      p.x += cos(uTime * 1.1 + aRnd * 17.0) * 0.010;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uPx * (1.0 + aRnd * 0.9) * (4.2 / -mv.z);
      vA = 0.55 + 0.45 * aRnd;
    }`,
  fragmentShader: `
    uniform sampler2D uMap; uniform float uOpacity;
    varying vec3 vC; varying float vA;
    void main(){
      vec4 t = texture2D(uMap, gl_PointCoord);
      if(t.a < 0.02) discard;
      gl_FragColor = vec4(vC * (1.35 + 0.5 * vA), t.a * vA * uOpacity);
    }`,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const bloomGroup = new THREE.Group();
const pts = new THREE.Points(geo, mat);
bloomGroup.add(pts);

// 中心光核
const core = new THREE.Sprite(new THREE.SpriteMaterial({
  map: softTex(.18, .5), color: 0xff8ec8, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, opacity: .85
}));
core.scale.setScalar(2.6);
core.position.y = .55;
bloomGroup.add(core);

scene.add(bloomGroup);

// 倒影
const mirror = new THREE.Group();
const pts2 = new THREE.Points(geo, mat.clone());
pts2.material.uniforms = mat.uniforms;
pts2.material.uniforms.uOpacity = { value: .22 };
const core2 = core.clone();
core2.material = core.material.clone();
core2.material.opacity = .18;
mirror.add(pts2); mirror.add(core2);
mirror.scale.y = -1;
mirror.position.y = -.02;
scene.add(mirror);

/* ---------- Bloom 后处理 ---------- */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
});
const rtA = new THREE.WebGLRenderTarget(innerWidth / 2, innerHeight / 2, { type: THREE.HalfFloatType });
const rtB = new THREE.WebGLRenderTarget(innerWidth / 2, innerHeight / 2, { type: THREE.HalfFloatType });

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
const fsScene = new THREE.Scene(); fsScene.add(quad);
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tD: { value: rt.texture }, uT: { value: 0.62 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tD; uniform float uT; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tD, vUv).rgb; float l = dot(c, vec3(.2126,.7152,.0722));
      gl_FragColor = vec4(c * smoothstep(uT, uT + .35, l), 1.); }`
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tD: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uRes: { value: new THREE.Vector2(innerWidth / 2, innerHeight / 2) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tD; uniform vec2 uDir, uRes; varying vec2 vUv;
    void main(){ vec2 px = uDir / uRes; vec3 s = vec3(0.);
      s += texture2D(tD, vUv).rgb * .2270;
      s += texture2D(tD, vUv + px * 1.3846).rgb * .3162;
      s += texture2D(tD, vUv - px * 1.3846).rgb * .3162;
      s += texture2D(tD, vUv + px * 3.2308).rgb * .0703;
      s += texture2D(tD, vUv - px * 3.2308).rgb * .0703;
      gl_FragColor = vec4(s, 1.); }`
});
const compMat = new THREE.ShaderMaterial({
  uniforms: { tS: { value: rt.texture }, tB: { value: rtB.texture } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tS, tB; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tS, vUv).rgb;
      vec3 b = texture2D(tB, vUv).rgb;
      c += b * 1.25;
      c = c / (c + 0.86);
      c = pow(c, vec3(.4545));
      gl_FragColor = vec4(c, 1.);
    }`
});

function pass(m, target) { quad.material = m; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }

/* ---------- 交互 ---------- */
let drag = false, px0 = 0, rotY = 0, rotTarget = 0;
renderer.domElement.addEventListener('pointerdown', e => { drag = true; px0 = e.clientX; });
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => {
  if (!drag) return;
  rotTarget += (e.clientX - px0) * .006; px0 = e.clientX;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rt.setSize(innerWidth, innerHeight);
  rtA.setSize(innerWidth / 2, innerHeight / 2);
  rtB.setSize(innerWidth / 2, innerHeight / 2);
});

/* ---------- 循环 ---------- */
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  mat.uniforms.uTime.value = t;

  rotY += (rotTarget - rotY) * .08;
  bloomGroup.rotation.y = rotY;
  mirror.rotation.y = rotY;

  // 呼吸
  const br = 1 + Math.sin(t * 1.15) * .028;
  bloomGroup.scale.setScalar(br);
  core.scale.setScalar(2.6 * (0.92 + Math.sin(t * 1.15) * .10));

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);

  pass(brightMat, rtA);

  blurMat.uniforms.tD.value = rtA.texture;
  blurMat.uniforms.uDir.value.set(1, 0);
  pass(blurMat, rtB);

  blurMat.uniforms.tD.value = rtB.texture;
  blurMat.uniforms.uDir.value.set(0, 1);
  pass(blurMat, rtA);

  compMat.uniforms.tB.value = rtA.texture;
  pass(compMat, null);

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
