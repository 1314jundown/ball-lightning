<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cover Lab · 封面粒子调参台</title>
<style>
  :root{
    --bg:#0b0c0e; --panel:#121417; --line:#232830; --text:#e8e6e0; --dim:#8b939e;
    --accent:#c98a3f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;background:var(--bg);color:var(--text);overflow:hidden;
    font:13px/1.5 -apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  }
  #stage{flex:1;position:relative;background:#000}
  #stage iframe{width:100%;height:100%;border:0;display:block}

  #panel{
    width:308px;flex:0 0 308px;height:100%;overflow-y:auto;
    background:var(--panel);border-right:1px solid var(--line);
    padding:16px 16px 40px;
  }
  #panel.hide{display:none}
  h1{font-size:13px;font-weight:600;letter-spacing:.06em;margin:0 0 2px}
  .sub{color:var(--dim);font-size:11px;margin:0 0 16px}
  .grp{border-top:1px solid var(--line);padding:12px 0 6px}
  .grp h2{font-size:10px;letter-spacing:.18em;color:var(--dim);margin:0 0 10px;font-weight:500;text-transform:uppercase}
  .row{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;margin:0 0 8px}
  .row label{font-size:11.5px;color:#c3c8d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row output{font-variant-numeric:tabular-nums;font-size:11px;color:var(--accent);text-align:right}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:18px;background:transparent;margin:0;
    grid-column:1 / -1;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2b313a;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);
    margin-top:-4.5px;border:0;cursor:pointer;
  }
  select,button{
    font:inherit;font-size:12px;color:var(--text);background:#191d23;
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;
  }
  select{width:100%}
  .btns{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
  .btns button{flex:1;min-width:72px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#17120a;font-weight:600}
  button:hover{border-color:#3a424e}
  #dump{
    width:100%;height:120px;margin-top:10px;background:#0d0f12;color:#9dd2a6;
    border:1px solid var(--line);border-radius:6px;padding:8px;
    font:11px/1.5 ui-monospace,Consolas,monospace;resize:vertical;
  }
  .note{color:var(--dim);font-size:11px;margin:10px 0 0;line-height:1.6}
  #toggle{
    position:fixed;left:308px;top:12px;z-index:9;width:24px;height:24px;border-radius:0 6px 6px 0;
  }
</style>
</head>
<body>

<div id="panel">
  <h1>封面粒子 · 调参台</h1>
  <p class="sub">改的是真实交付页（iframe 里的 dist/index.html），参数即时生效。</p>

  <div class="grp">
    <h2>气质</h2>
    <select id="fx">
      <option value="plasma">plasma · 电浆</option>
      <option value="ember">ember · 炭火</option>
      <option value="abyss">abyss · 深渊</option>
    </select>
    <div class="btns">
      <button id="bloomOn">bloom 开</button>
      <button id="bloomOff">bloom 关</button>
    </div>
  </div>

  <div class="grp">
    <h2>球体几何</h2>
    <div class="row"><label>scale 放大</label><output id="o-scale"></output>
      <input type="range" id="scale" min="1" max="8" step="0.05"></div>
    <div class="row"><label>camY 上下</label><output id="o-camY"></output>
      <input type="range" id="camY" min="-0.9" max="0.9" step="0.01"></div>
    <div class="row"><label>camX 左右</label><output id="o-camX"></output>
      <input type="range" id="camX" min="-1.6" max="1.6" step="0.01"></div>
  </div>

  <div class="grp">
    <h2>颗粒</h2>
    <div class="row"><label>ballPx 点径</label><output id="o-ballPx"></output>
      <input type="range" id="ballPx" min="1" max="6" step="0.1"></div>
    <div class="row"><label>ballPxMax 上限</label><output id="o-ballPxMax"></output>
      <input type="range" id="ballPxMax" min="1.5" max="12" step="0.1"></div>
    <div class="row"><label>ballAlpha 不透明</label><output id="o-ballAlpha"></output>
      <input type="range" id="ballAlpha" min="0.1" max="3" step="0.05"></div>
    <div class="row"><label>rimPow 壳厚度</label><output id="o-rimPow"></output>
      <input type="range" id="rimPow" min="0.4" max="4" step="0.05"></div>
  </div>

  <div class="grp">
    <h2>暖核</h2>
    <div class="row"><label>coreAmt 强度</label><output id="o-coreAmt"></output>
      <input type="range" id="coreAmt" min="0" max="2" step="0.05"></div>
  </div>

  <div class="grp">
    <h2>配色与光</h2>
    <div class="row"><label>gain 总亮度</label><output id="o-gain"></output>
      <input type="range" id="gain" min="0.4" max="2.6" step="0.02"></div>
    <div class="row"><label>haloAmt 光晕</label><output id="o-haloAmt"></output>
      <input type="range" id="haloAmt" min="0" max="0.8" step="0.01"></div>
    <div class="row"><label>bloom 强度</label><output id="o-bloom"></output>
      <input type="range" id="bloom" min="0" max="2.5" step="0.05"></div>
    <div class="row"><label>bright 泛光阈值</label><output id="o-bright"></output>
      <input type="range" id="bright" min="0.1" max="0.95" step="0.01"></div>
    <div class="row"><label>flicker 抖动</label><output id="o-flicker"></output>
      <input type="range" id="flicker" min="0" max="1.2" step="0.02"></div>
    <div class="row"><label>spin 自转</label><output id="o-spin"></output>
      <input type="range" id="spin" min="0" max="0.5" step="0.005"></div>
  </div>

  <div class="grp">
    <div class="btns">
      <button class="primary" id="copy">复制参数</button>
      <button id="reset">重置</button>
      <button id="reload">刷新 iframe</button>
    </div>
    <textarea id="dump" spellcheck="false" readonly placeholder="点「复制参数」后这里会出现可直接贴回来的 JSON"></textarea>
    <p class="note">顺序：先在 iframe 里滚轮/拖动把机位调顺，再用这里的滑块定数值；调好后点「复制参数」贴回对话。</p>
  </div>
</div>
<button id="toggle" title="隐藏/显示面板">◀</button>

<div id="stage">
  <iframe id="view" src="../dist/index.html?cover=1&fx=plasma"></iframe>
</div>

<script>
(function () {
  'use strict';
  var KEYS = ['scale', 'camY', 'camX', 'ballPx', 'ballPxMax', 'ballAlpha', 'rimPow',
              'coreAmt', 'gain', 'haloAmt', 'bloom', 'bright', 'flicker', 'spin'];
  var view = document.getElementById('view');
  var fxSel = document.getElementById('fx');
  var dump = document.getElementById('dump');
  var api = null;
  var baseline = {};

  function frameApi() {
    try {
      var w = view.contentWindow;
      return w && w.__coverParticles ? w.__coverParticles : null;
    } catch (e) { return null; }
  }

  function readLook() {
    if (!api) return null;
    var l = api.look();
    var out = {};
    for (var i = 0; i < KEYS.length; i++) {
      var k = KEYS[i];
      out[k] = (k in l) ? l[k] : l.preset[k];
    }
    return out;
  }

  function syncInputs() {
    var v = readLook();
    if (!v) return;
    for (var i = 0; i < KEYS.length; i++) {
      var k = KEYS[i];
      var el = document.getElementById(k);
      var out = document.getElementById('o-' + k);
      if (!el) continue;
      if (document.activeElement !== el) el.value = v[k];
      if (out) out.textContent = (+v[k]).toFixed(k === 'ballPx' || k === 'ballPxMax' ? 1 : 2);
    }
    fxSel.value = api.fxName || 'plasma';
  }

  function push(k, val) {
    if (!api) return;
    var patch = {};
    patch[k] = val;
    api.tune(patch);
    var out = document.getElementById('o-' + k);
    if (out) out.textContent = (+val).toFixed(k === 'ballPx' || k === 'ballPxMax' ? 1 : 2);
  }

  KEYS.forEach(function (k) {
    var el = document.getElementById(k);
    if (!el) return;
    el.addEventListener('input', function () { push(k, parseFloat(el.value)); });
  });

  fxSel.addEventListener('change', function () {
    if (!api) return;
    api.fx(fxSel.value);
    setTimeout(syncInputs, 60);
  });

  document.getElementById('bloomOn').addEventListener('click', function () { if (api) api.bloom(true); });
  document.getElementById('bloomOff').addEventListener('click', function () { if (api) api.bloom(false); });

  document.getElementById('copy').addEventListener('click', function () {
    var v = readLook();
    if (!v) return;
    var txt = JSON.stringify(v, null, 2);
    dump.value = txt;
    dump.select();
    try { document.execCommand('copy'); } catch (e) {}
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (!api || !baseline) return;
    api.tune(baseline);
    setTimeout(syncInputs, 60);
  });

  document.getElementById('reload').addEventListener('click', function () {
    view.src = '../dist/index.html?cover=1&fx=' + fxSel.value;
    api = null;
    setTimeout(boot, 1200);
  });

  document.getElementById('toggle').addEventListener('click', function () {
    var p = document.getElementById('panel');
    p.classList.toggle('hide');
    this.textContent = p.classList.contains('hide') ? '▶' : '◀';
    this.style.left = p.classList.contains('hide') ? '0' : '308px';
  });

  function boot() {
    api = frameApi();
    if (!api) { setTimeout(boot, 400); return; }
    baseline = readLook();
    api.bloom(true);            // 无头/低帧时也强制开 bloom，方便看效果
    syncInputs();
    setInterval(syncInputs, 800);
  }

  view.addEventListener('load', function () { api = null; setTimeout(boot, 600); });
  setTimeout(boot, 1200);
})();
</script>
</body>
</html>
