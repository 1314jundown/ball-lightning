<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>wawa-vfx 试用</title>
<style>
  html,body{margin:0;height:100%;background:#06070a;overflow:hidden}
  canvas{display:block}
  .hud{position:fixed;left:28px;bottom:24px;font:11px/1.9 ui-monospace,monospace;
       color:#8b93a4;letter-spacing:.14em;pointer-events:none}
  .hud b{color:#e8e2d6;font-weight:500}
  .tag{position:fixed;top:24px;font:10px ui-monospace,monospace;letter-spacing:.2em;
       color:#6d7588;pointer-events:none}
</style>
</head>
<body>
<div class="tag" style="left:28px">WAWA VFX · VANILLA 1.2.10 · MIT</div>
<div class="tag" style="right:28px">FIREWORKS / FIRE / MAGIC</div>
<div class="hud"><b>wawa-vfx-vanilla</b>　29KB · VFXParticles + VFXEmitter</div>
<script src="../vendor/three.bundle.js"></script>
<script src="assets/wawa-vfx.js"></script>
<script>
(() => {
  const { VFXParticles, VFXEmitter, AppearanceMode } = WawaVFXVanilla;

function makeSoft() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SOFT = makeSoft();

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x06070a, 1);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 2.2, 11);
  camera.lookAt(0, 1.6, 0);

  /* ---- 1. 烟花 ---- */
  const fw = new VFXParticles('fw', {
    nbParticles: 20000,
    gravity: [0, -2.6, 0],
    renderMode: 'billboard',
    intensity: 2.4,
    appearance: AppearanceMode.Circular,
    easeFunction: 'easeOutCubic',
    fadeAlpha: [0.05, 0.85],
    fadeSize: [0.25, 0.9],
    blendingMode: THREE.AdditiveBlending
  }, undefined, SOFT);
  fw.getMesh().frustumCulled = false; scene.add(fw.getMesh());
  const fwEm = new VFXEmitter('fw', {
    loop: true, duration: 3.2, nbParticles: 420, spawnMode: 'burst', delay: 0,
    particlesLifetime: [1.1, 2.1],
    startPositionMin: [-4.6, 2.6, -1.4], startPositionMax: [-3.4, 3.5, -0.6],
    directionMin: [-1, -1, -1], directionMax: [1, 1, 1],
    size: [0.35, 1.1], speed: [2.2, 6.2],
    colorStart: ['#ffe9b0', '#ffb35c'], colorEnd: ['#ff5a2b', '#8a1d10']
  });
  scene.add(fwEm);

  /* ---- 2. 火焰 ---- */
  const fr = new VFXParticles('fr', {
    nbParticles: 16000,
    gravity: [0, 1.5, 0],
    renderMode: 'billboard',
    intensity: 2.0,
    appearance: AppearanceMode.Circular,
    easeFunction: 'easeOutCubic',
    fadeAlpha: [0.05, 0.8],
    fadeSize: [0.15, 1.0],
    blendingMode: THREE.AdditiveBlending
  }, undefined, SOFT);
  fr.getMesh().frustumCulled = false; scene.add(fr.getMesh());
  const frEm = new VFXEmitter('fr', {
    loop: true, duration: 2, nbParticles: 90, spawnMode: 'time', delay: 0,
    particlesLifetime: [0.5, 1.6],
    startPositionMin: [-0.3, 0, -0.3], startPositionMax: [0.3, 0.35, 0.3],
    directionMin: [-0.35, 1, -0.35], directionMax: [0.35, 2.2, 0.35],
    size: [0.4, 1.2], speed: [1.4, 3.4],
    colorStart: ['#fff1c9', '#ffb347'], colorEnd: ['#ff5522', '#5c1206']
  });
  frEm.position.set(0, 0.2, 0);
  scene.add(frEm);

  /* ---- 3. 魔法粒子 ---- */
  const mg = new VFXParticles('mg', {
    nbParticles: 16000,
    gravity: [0, 0.35, 0],
    renderMode: 'billboard',
    intensity: 2.2,
    appearance: AppearanceMode.Circular,
    easeFunction: 'easeInOutSine',
    fadeAlpha: [0.1, 0.9],
    fadeSize: [0.3, 0.8],
    blendingMode: THREE.AdditiveBlending
  }, undefined, SOFT);
  mg.getMesh().frustumCulled = false; scene.add(mg.getMesh());
  const mgEm = new VFXEmitter('mg', {
    loop: true, duration: 2.4, nbParticles: 140, spawnMode: 'time', delay: 0,
    particlesLifetime: [0.9, 2.2],
    startPositionMin: [-0.6, 0, -0.6], startPositionMax: [0.6, 0.2, 0.6],
    directionMin: [-1.2, 0.4, -1.2], directionMax: [1.2, 1.8, 1.2],
    size: [0.35, 1.0], speed: [0.6, 2.2],
    colorStart: ['#bfe6ff', '#c9a6ff'], colorEnd: ['#3a5cff', '#20124a']
  });
  mgEm.position.set(3.6, 0.2, 0);
  scene.add(mgEm);

  /* ---- 地台 ---- */
  const grid = new THREE.GridHelper(28, 28, 0x1b2233, 0x121722);
  scene.add(grid);

  const clock = new THREE.Clock();
  function loop() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.getElapsedTime();
    fwEm.update(t, dt); fw.update(t);
    frEm.update(t, dt); fr.update(t);
    mgEm.update(t, dt); mg.update(t);
    camera.position.x = Math.sin(t * 0.12) * 1.2;
    camera.lookAt(0, 1.5, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
