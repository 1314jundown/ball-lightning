<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>入学测试 · 球状闪电</title>
<style>
  :root{--ink:#dbe7f5;--dim:#7f93ad;--line:rgba(120,160,220,.18);--cyan:#7fd0ff;--amber:#ffcf80}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05070b;color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  #bg{position:fixed;inset:0;background:
    radial-gradient(1200px 520px at 50% -8%, rgba(60,120,200,.16), transparent 70%),
    radial-gradient(700px 380px at 80% 108%, rgba(255,190,110,.06), transparent 70%);
    pointer-events:none}
  .wrap{position:relative;width:min(780px,92vw)}
  .top{display:flex;justify-content:space-between;align-items:baseline;
    font:12px/1 ui-monospace,Consolas,monospace;color:var(--dim);letter-spacing:.14em;margin-bottom:26px}
  .top b{color:var(--cyan);font-weight:600}
  h1{font-size:26px;line-height:1.5;font-weight:600;margin:0 0 10px;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:14px;line-height:1.75;margin:0 0 26px}
  .opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:12px;
    background:rgba(12,20,32,.72);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-size:15px;line-height:1.6;cursor:pointer;transition:.16s}
  .opt:hover{border-color:rgba(127,208,255,.55);background:rgba(16,30,48,.9);transform:translateX(2px)}
  .dots{display:flex;gap:6px;margin-top:22px}
  .dots i{width:26px;height:2px;background:rgba(120,160,220,.2)}
  .dots i.on{background:var(--cyan)}
  .card{background:rgba(10,17,27,.82);border:1px solid var(--line);border-radius:14px;padding:28px}
  .avatar{width:96px;height:96px;border-radius:50%;border:1px dashed rgba(127,208,255,.4);
    display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:.1em;
    margin-bottom:18px;background:radial-gradient(circle at 50% 40%, rgba(127,208,255,.12), transparent 70%)}
  .branch{font-size:15px;color:var(--amber);letter-spacing:.16em;margin-bottom:6px}
  .name{font-size:30px;margin-bottom:14px}
  .desc{color:#a9bcd2;font-size:14.5px;line-height:1.85;margin-bottom:18px}
  .stats{display:grid;gap:8px;margin:18px 0 24px;font-size:13.5px;color:#b8c9dd}
  .stats div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(120,160,220,.14);padding-bottom:6px}
  .stats span:last-child{color:var(--cyan)}
  .go{display:inline-block;padding:12px 26px;border-radius:8px;border:1px solid rgba(127,208,255,.5);
    background:rgba(127,208,255,.12);color:#dff2ff;font-size:15px;cursor:pointer;text-decoration:none}
  .go:hover{background:rgba(127,208,255,.2)}
  .attrhead{margin:18px 0 8px;font-size:12px;letter-spacing:.18em;color:#6d86a8}
  .attr{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
  .arow{display:flex;align-items:baseline;gap:10px;font-size:12.5px;color:#93a7c2;border-bottom:1px dashed rgba(120,150,190,.14);padding-bottom:6px}
  .arow b{color:#4f6b8f;font-weight:400;width:14px;flex:0 0 14px;text-align:right}
  .arow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arow em{color:#cfe0f5;font-style:normal;font-size:11.5px;letter-spacing:.06em}
  .again{color:var(--dim);font-size:13px;margin-left:16px;cursor:pointer;text-decoration:underline}
  .foot{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:12px;color:#4d5f77;letter-spacing:.08em}
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap" id="app"></div>
<div class="foot">没有正确答案 · 只看你会注意到什么</div>
<script>
(function () {
  var QS = [
    { q: '雷雨夜，你守到凌晨三点，窗外亮了一下。', opts: [
      { t: '写下时间、方位、亮了几次', w: { o: 3, c: 0, e: 1, w: 1 } },
      { t: '抄起设备往楼下跑', w: { o: 1, c: 3, e: 0, w: 0 } },
      { t: '先摸一遍仪器，别是被打坏了', w: { o: 1, c: 0, e: 3, w: 0 } }
    ]},
    { q: '一张照片上只有一个模糊亮斑，同事说拍废了。', opts: [
      { t: '把边缘放大，看有没有拖尾', w: { o: 3, c: 0, e: 1, w: 1 } },
      { t: '架好机位，再拍一次，拍到清楚为止', w: { o: 1, c: 3, e: 1, w: 0 } },
      { t: '去问快门、光圈、感光器的参数', w: { o: 1, c: 0, e: 3, w: 0 } }
    ]},
    { q: '报告里三个数字互相矛盾，没人改得动。', opts: [
      { t: '标出来，附上各自的误差范围', w: { o: 3, c: 0, e: 1, w: 1 } },
      { t: '挑一个最像样的，先往下推', w: { o: 0, c: 3, e: 0, w: 0 } },
      { t: '从头重算一遍', w: { o: 1, c: 0, e: 3, w: 0 } }
    ]},
    { q: '报废靶场上，一辆坦克的车顶落了一只鸟。', opts: [
      { t: '看那只鸟在做什么', w: { o: 3, c: 0, e: 0, w: 1 } },
      { t: '它是昨天那辆，我打偏过一发', w: { o: 1, c: 3, e: 0, w: 0 } },
      { t: '炮塔上的编号是多少', w: { o: 1, c: 0, e: 3, w: 0 } }
    ]},
    { q: '深夜有人敲门：「上面要提前验收。」', opts: [
      { t: '不出声，把这一页记录写完', w: { o: 2, c: 0, e: 0, w: 3 } },
      { t: '开门，看是谁', w: { o: 0, c: 2, e: 1, w: 0 } },
      { t: '先备份数据，再去开门', w: { o: 0, c: 0, e: 3, w: 1 } }
    ]}
  ];

  var BRANCHES = {
    o: { id: 'dingyi', tag: '观测者', name: '丁仪', desc: '你只相信能被观测到的东西。别人在算能量，你在数次数；别人在写结论，你在写误差。这段路走得慢，但你看见的东西比谁都多。',
         stats: [['索敌半径', '+4 m'], ['电弧连锁', '+1'], ['单发伤害', '−15%']] },
    c: { id: 'linyun', tag: '实战派', name: '林云', desc: '你先开火，再解释。武器在你手里不是论文，是扳机；打偏了也是数据，打中了就是答案。',
         stats: [['单发伤害', '+25%'], ['充能间隔', '−10%'], ['生命上限', '−15']] },
    e: { id: 'zhangbin', tag: '工程派', name: '张彬', desc: '能算出来的东西，就一定能造出来。你把危险拆成工序，把工序排成表，然后一格一格往前走。',
         stats: [['充能间隔', '−20%'], ['生命上限', '+20'], ['单发伤害', '−10%']] },
    w: { id: 'observer', tag: '主角', name: '陈博士', desc: '你是陈博士。这一切是你后来记下来的：你既在动手，也在看着自己动手。有些事当时没看清，就只能照记得的样子写下来。',
         stats: [['正前方伤害', '×1.6'], ['其余方向', '×0.85'], ['索敌半径', '+2 m']] }
  };

  var app = document.getElementById('app');
  var idx = 0, score = { o: 0, c: 0, e: 0, w: 0 };
  var W = [3, 2, 1, 1, 1];        // C：首题定调，第二题次之
  var picks = [];                 // 每题落在谁身上，供结果页解释

  function render() {
    var item = QS[idx];
    var html = ''
      + '<div class="top"><span>入学测试</span><b>' + String(idx + 1).padStart(2, '0') + ' / ' + String(QS.length).padStart(2, '0') + '</b></div>'
      + '<h1>' + item.q + '</h1>'
      + '<p class="sub">选一个最像你的反应。没有正确答案。</p>';
    item.opts.forEach(function (op, i) {
      html += '<button class="opt" data-i="' + i + '">' + op.t + '</button>';
    });
    html += '<div class="dots">';
    for (var i = 0; i < QS.length; i++) html += '<i class="' + (i <= idx ? 'on' : '') + '"></i>';
    html += '</div>';
    app.innerHTML = html;
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (b) {
      b.onclick = function () {
        var w = item.opts[Number(b.dataset.i)].w, k = W[idx] || 1;
        score.o += w.o * k; score.c += w.c * k; score.e += w.e * k; score.w += w.w * k;
        picks.push({ t: item.opts[Number(b.dataset.i)].t, w: w });
        idx++;
        if (idx < QS.length) render(); else result();
      };
    });
  }

  function result() {
    var order = ['o', 'c', 'e', 'w'];
    var key = 'o', best = -1, tie = [];
    order.forEach(function (k) {
      if (score[k] > best) { best = score[k]; tie = [k]; key = k; }
      else if (score[k] === best) tie.push(k);
    });
    if (tie.length > 1) {
      var f = picks[0] ? picks[0].w : null, fk = null, fv = -1;
      if (f) order.forEach(function (k) { if (tie.indexOf(k) >= 0 && f[k] > fv) { fv = f[k]; fk = k; } });
      key = fk || tie[0];
    }
    var b = BRANCHES[key];
    var WHO = { o: '丁仪', c: '林云', e: '张彬', w: '陈博士' };
    var attr = picks.map(function (p, i) {
      var k = 'o', bv = -1;
      order.forEach(function (x) { if (p.w[x] > bv) { bv = p.w[x]; k = x; } });
      return '<div class="arow"><b>' + (i + 1) + '</b><span>' + p.t + '</span><em>' + WHO[k] + '</em></div>';
    }).join('');
    var stats = b.stats.map(function (s) { return '<div><span>' + s[0] + '</span><span>' + s[1] + '</span></div>'; }).join('');
    app.innerHTML = '<div class="card">'
      + '<div class="avatar" id="avatar">头像待接入</div>'
      + '<div class="branch">' + b.tag + '</div>'
      + '<div class="name">' + b.name + '</div>'
      + '<p class="desc">' + b.desc + '</p>'
      + '<div class="stats">' + stats + '</div>'
      + '<div class="attrhead">每题落在谁身上</div>'
      + '<div class="attr">' + attr + '</div>'
      + '<a class="go" href="showcase.html?b=' + b.id + '">进入武器库 →</a>'
      + '<span class="again" id="again">重测一次</span>'
      + '</div>';
    var goEl = app.querySelector('.go');
if (goEl) goEl.addEventListener('click', function (ev) {
  if (window.top === window) return;
  ev.preventDefault();
  try { parent.postMessage({ type: 'bl:quiz:enter', branch: b.id }, '*'); } catch (e) {}
});
document.getElementById('again').onclick = function () {
      idx = 0; score = { o: 0, c: 0, e: 0, w: 0 }; render();
    };
    try { localStorage.setItem('bl.branch', b.id); } catch (e) {}
try { parent.postMessage({ type: 'bl:quiz:done', branch: b.id }, '*'); } catch (e) {}
    // 方便外部接入头像：把当前分支挂到 window 上
    window.__branch = b;
  }

  render();
  window.__quiz = { score: function () { return score; }, result: result };
})();
</script>
</body>
</html>
